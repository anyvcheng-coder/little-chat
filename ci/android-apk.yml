name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync assets into the Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/little-chat.apk
          ls -lh build-output

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-chat-apk
          path: build-output/little-chat.apk
          if-no-files-found: error

      # 覆盖同一个 apk 标签，手机上用固定链接下载最新包
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: little chat · 安卓安装包
          make_latest: true
          files: build-output/little-chat.apk
          body: |
            little chat 安卓安装包（debug 签名，可直接安装）。

            下载 `little-chat.apk`，在手机上打开安装即可；首次安装需要允许「安装未知来源应用」。
            安装后可在应用内填写 API Key 与生图接口，所有会话与图片只保存在手机本地。

            这是自动构建的开发签名包，仅自用；如需上架请自行配置 release 签名。
